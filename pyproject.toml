[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kccs-evidence-kernel"
version = "0.2.0"
description = "Tenant-scoped, temporally correct evidence-resolution and replay kernel (KCCS Sentinel case study prototype)"
requires-python = ">=3.11"
dependencies = [
  "openpyxl==3.1.5",
  "tzdata>=2024.1",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "httpx>=0.27,<1.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
kccs-evidence = "kccs_evidence.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kccs_evidence = ["config/*.json", "interfaces/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E701", "E702", "RUF001", "RUF002", "RUF003", "SIM108", "B008"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 120. Human-readable finding/report message literals may run longer.
max-line-length = 240

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["kccs_evidence"]

[tool.mypy]
python_version = "3.11"
files = ["src/kccs_evidence"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kccs_evidence.interfaces.*", "kccs_evidence.application.service", "kccs_evidence.domain.ports", "kccs_evidence.application.ports"]
disallow_untyped_defs = true

[tool.fastapi]
entrypoint = "kccs_evidence.interfaces.api.app:create_app"
