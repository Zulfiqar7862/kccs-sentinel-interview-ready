# One-command demo: put the workbook in ./data, then `docker compose up --build` and open http://localhost:8000
services:
  api:
    build: .
    image: kccs-evidence-kernel:local
    ports:
      - "${KCCS_PORT:-8000}:8000"
    environment:
      KCCS_LOG_LEVEL: ${KCCS_LOG_LEVEL:-INFO}
      KCCS_DEMO_ENDPOINTS: ${KCCS_DEMO_ENDPOINTS:-true}
      KCCS_FIXED_NOW: ${KCCS_FIXED_NOW:-}
    volumes:
      - ./data:/data:ro                 # the confidential workbook stays on your machine, read-only
      - kccs-state:/var/lib/kccs        # append-only SQLite store and exported packages
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  kccs-state:
