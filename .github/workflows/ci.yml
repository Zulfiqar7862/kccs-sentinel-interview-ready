name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint · types · tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint and format (ruff)
        run: ruff check src tests && ruff format --check src tests
      - name: Static types (mypy)
        run: mypy
      # The confidential workbook is not in the repository, so workbook-backed tests skip here;
      # architecture, API-contract, synthetic-fixture and state-machine tests still run.
      # The full suite (116 tests) and scripts/e2e_check.sh run locally with the workbook in data/.
      - name: Tests
        run: python -m pytest -q -rs

  docker:
    name: container image builds and starts
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kccs-evidence-kernel:ci .
      - name: Liveness without a workbook (readiness is expected to be 503)
        run: |
          docker run -d --name k -p 8000:8000 kccs-evidence-kernel:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health/live && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/health/ready)" = 503
          docker logs k
